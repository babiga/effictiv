name: Eco CI build energy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/eco-ci-build.yml
      - scripts/capture-eco-ci.mjs

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'babiga/effictiv' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        id: node
        with:
          node-version: '22.23.5'

      - uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        id: eco-ci
        continue-on-error: true
        with:
          task: start-measurement
          machine: ubuntu-24.04
          machine-power-data: github_EPYC_7763_4_CPU_shared.sh
          send-data: false
          json-output: true

      - name: Install dependencies
        id: install
        run: npm ci
      - uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        if: ${{ !cancelled() && steps.eco-ci.outcome == 'success' && steps.install.outcome != 'skipped' }}
        continue-on-error: true
        with:
          task: get-measurement
          label: npm ci

      - name: Build production app
        id: build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        if: ${{ !cancelled() && steps.eco-ci.outcome == 'success' && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        with:
          task: get-measurement
          label: npm run build

      - name: Package the collector export
        id: capture
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node scripts/capture-eco-ci.mjs "$RUNNER_TEMP/effictiv-eco-ci.json"
        env:
          ECO_CI_JOB_ID: ${{ job.check_run_id }}
          ECO_CI_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          ECO_CI_BUILD_OUTCOME: ${{ steps.build.outcome }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        with:
          name: effictiv-eco-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/effictiv-eco-ci.json
          if-no-files-found: error
          retention-days: 90
