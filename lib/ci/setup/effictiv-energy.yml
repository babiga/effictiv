name: Effictiv CI energy

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        id: node
        with:
          node-version: '22.23.5'

      - name: Check runner support
        id: runner
        run: node -e 'console.log("supported=" + (process.arch === "x64" && require("node:os").availableParallelism() === 4))' >> "$GITHUB_OUTPUT"
      - uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        if: steps.runner.outputs.supported == 'true'
        id: eco-ci
        continue-on-error: true
        with:
          task: start-measurement
          machine: ubuntu-24.04
          machine-power-data: github_EPYC_7763_4_CPU_shared.sh
          send-data: false
          json-output: true

      - name: Install dependencies
        id: install
        run: npm ci
      - uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        id: install-sample
        if: ${{ !cancelled() && steps.eco-ci.outcome == 'success' && steps.install.outcome != 'skipped' }}
        continue-on-error: true
        with:
          task: get-measurement
          label: npm ci

      - name: Build production app
        id: build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        id: build-sample
        if: ${{ !cancelled() && steps.eco-ci.outcome == 'success' && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        with:
          task: get-measurement
          label: npm run build

      - name: Package the collector export
        id: capture
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node scripts/capture-eco-ci.mjs "$RUNNER_TEMP/effictiv-eco-ci.json"
        env:
          ECO_CI_JOB_ID: ${{ job.check_run_id }}
          ECO_CI_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          ECO_CI_BUILD_OUTCOME: ${{ steps.build.outcome }}
          ECO_CI_INITIALIZE_OUTCOME: ${{ steps.eco-ci.outcome }}
          ECO_CI_INSTALL_SAMPLE_OUTCOME: ${{ steps.install-sample.outcome }}
          ECO_CI_BUILD_SAMPLE_OUTCOME: ${{ steps.build-sample.outcome }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        with:
          name: effictiv-eco-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/effictiv-eco-ci.json
          if-no-files-found: error
          retention-days: 90
